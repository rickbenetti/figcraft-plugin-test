[package]
name = "figcraft-plugin-test"
version = "0.1.0"
description = "FigCraft plugin: a test bench for plugin API behaviours. Pick a case and see on screen what the plugin received."
license = "MIT"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
figcraft-plugin-sdk = { git = "https://github.com/storytold/figcraft", tag = "v0.14.0" }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

# Small module: a plugin is loaded on every run.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
